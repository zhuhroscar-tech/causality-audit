name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + test deps
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -v --cov=causality_audit --cov-report=term-missing
      - name: Smoke-test installed console script
        run: |
          causality-audit --version
          causality-audit --help
          causality-audit --demo clean --no-color
          causality-audit --demo buggy --no-color
          causality-audit --demo buggy --json --no-color | python -m json.tool > /dev/null
          # --check-clean must be non-zero on the buggy demo (real regression guard)
          if causality-audit --demo buggy --check-clean --json > /dev/null; then
            echo "ERROR: --check-clean should have exited non-zero on the buggy demo"
            exit 1
          fi
          causality-audit --demo clean --check-clean --json > /dev/null

  build-artifact:
    name: build wheel + sdist
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python -m build
      - name: Smoke-test the built wheel on this Linux runner
        run: |
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install dist/*.whl
          /tmp/smoke-venv/bin/causality-audit --version
          /tmp/smoke-venv/bin/causality-audit --demo buggy --json --no-color | python3 -m json.tool > /dev/null
      - name: Compute checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
