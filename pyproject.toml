[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "causality-audit"
version = "0.1.0"
description = "Two-forward-pass prefix-invariance (causal-leakage) audit for sequence-model layers, with a synthetic chunked-scan oracle reproducing the Zamba2/Nemotron-H bug class"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "zhuhroscar-tech" }]
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/zhuhroscar-tech/causality-audit"

[project.scripts]
causality-audit = "causality_audit.cli:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
